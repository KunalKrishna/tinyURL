# Values come from a .env file next to this file (see .env.example);
# the ":-default" fallbacks keep local dev working without one.

# The Database Infrastructure
services:
  postgres:
    image: 'postgres:17' # Pulls a ready-made official image instead of building one
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgresDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only started with `docker compose --profile app up`;
  # `./mvnw spring-boot:run` (spring-boot-docker-compose) starts just postgres.

  # The Spring Boot Application
  spring-boot-url-shortener:
    image: kunalkrishna85/spring-boot-url-shortener:${IMAGE_TAG:-latest}
    container_name: spring-boot-url-shortener
    profiles: ["app"]
    environment: # Injects runtime database credentials into application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgresDB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080" # Maps port 8080 from container to localhost
    restart: unless-stopped
    depends_on: # Forces the database to start up first
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

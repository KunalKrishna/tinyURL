name: CI & EC2 Zero-Credit Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # Compile and execute unit/integration tests using local runner assets
      - name: Build & Test
        run: ./mvnw -B verify

  deploy-to-ec2:
    needs: test-and-verify
    if: github.event_name == 'push' # This step will strictly execute ONLY on commits pushed directly to the main branch
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e   # stop (and fail the job) at the first failing command
            APP_DIR="$HOME/spring-boot-url-shortener"   # "~" is not expanded inside quotes; $HOME is

            # 1. Get the code: clone on the first run, afterwards fetch only the changed objects
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main   # .env is git-ignored, so it survives this

            # 2. Refuse to start with compose.yaml's fallback credentials / localhost base URL
            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env: copy .env.example to .env on the server and set real values" >&2
              exit 1
            fi

            # 3. Rebuild the image (Docker reuses the cached dependency layer unless pom.xml changed)
            #    and start postgres + app. Naming the service activates its "app" profile.
            docker compose up --build -d spring-boot-url-shortener

            # 4. Delete the untagged image left behind by the rebuild (the build cache is kept)
            docker image prune -f

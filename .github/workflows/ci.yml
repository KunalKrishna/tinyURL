name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: kunalkrishna/spring-boot-url-shortener

defaults:
  run:
    working-directory: url_shortner   # the Maven project lives in a sub-folder of the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # compile + unit/integration tests (Testcontainers uses the runner's Docker)
      - name: Build & test
        run: ./mvnw -B verify

      # --- everything below only on main, never on pull requests ---
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildpacks image, no Dockerfile; tests already ran above
      - name: Build image
        if: github.event_name == 'push'
        run: ./mvnw -B -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=$IMAGE_NAME:${{ github.sha }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

# Values come from a .env file next to this file (see .env.example);
# the ":-default" fallbacks keep local dev working without one.

# Pinned project name (otherwise derived from the folder name, which differs between
# a local checkout and ~/spring-boot-url-shortener on EC2). Prefixes the volume/container names.
name: url_shortner

# The Database Infrastructure
services:
  postgres:
    image: 'postgres:17' # Pulls a ready-made official image instead of building one
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgresDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 127.0.0.1: reachable from the host (./mvnw spring-boot:run) but not from the internet on EC2;
      # the app container reaches it over the compose network as postgres:5432
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The Spring Boot Application
  spring-boot-url-shortener:
    container_name: shortener-app
    # Only started when targeted by name (`docker compose up --build -d spring-boot-url-shortener`,
    # as the deploy workflow does) or with `--profile app`. `./mvnw spring-boot:run` starts just postgres.
    profiles: ["app"]
    # ─── ROUTE 4 INTEGRATION START ───
    build:
      context: .
      dockerfile: Dockerfile
    # ─────────────────────────────────
    environment: # Injects runtime database credentials into application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgresDB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080" # Maps port 8080 from container to localhost
    restart: unless-stopped
    depends_on: # Forces the database to start up first
      postgres:
        condition: service_healthy

volumes:
  postgres_data: # ◄─── CRITICAL: This preserves your data across all updates
